apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark
spec:
  type: Scala
  mode: cluster
  image: docker.io/apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.1.jar"
  sparkVersion: 3.5.1
  restartPolicy:
    type: Never
  arguments:
    - "1000000"
  sparkUIOptions:
    ingressTLS:
      - hosts:
          - "spark-pi.spark.sparkui.local.me"
        secretName: wildcard-local-tls

  driver:
    serviceAccount: spark-operator-spark
    cores: 1
    coreLimit: "1200m"
    memory: 4g
    labels:
      version: 3.5.1
  executor:
    serviceAccount: spark-operator-spark
    cores: 1
    instances: 1
    memory: 4g
    labels:
      version: 3.5.1